name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The iroh helper is Rust, so each platform builds on its own runner.
  cli:
    strategy:
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            targets: linux/amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            targets: linux/arm64
          - name: darwin
            runner: macos-latest
            targets: darwin/arm64 darwin/amd64
          - name: windows-amd64
            runner: windows-latest
            targets: windows/amd64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq musl-tools; fi

      - name: Build passage-cli
        env:
          PASSAGE_LINK_AUTHOR_KEY: ${{ vars.PASSAGE_LINK_AUTHOR_KEY }}
          PYTHON: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          TAG: ${{ github.ref_name }}
        run: scripts/build-cli.sh "${TAG#v}" dist ${{ matrix.targets }}

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    needs: cli
    runs-on: ubuntu-latest
    # Signing secrets live in this environment only, never in PR builds.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the Gradle wrapper
        run: |
          version=$(sed -n 's#.*gradle-\(.*\)-bin.zip#\1#p' android/gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "$want  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 11076708
          packages: "ndk;27.2.12479018 platforms;android-36 build-tools;35.0.0"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Go test
        working-directory: ./core
        run: go test ./...

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build libpassage.so
        env:
          PASSAGE_LINK_AUTHOR_KEY: ${{ vars.PASSAGE_LINK_AUTHOR_KEY }}
        run: scripts/build-native.sh

      - name: Build signed APK
        working-directory: ./android
        env:
          KEYSTORE_B64: ${{ secrets.PASSAGE_KEYSTORE_B64 }}
          PASSAGE_KEYSTORE_PASS: ${{ secrets.PASSAGE_KEYSTORE_PASS }}
          PASSAGE_KEY_ALIAS: passage # not secret; as a secret it was masked in every log
        run: |
          test -n "$KEYSTORE_B64" || { echo "signing secrets missing" >&2; exit 1; }
          export PASSAGE_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_B64" | base64 -d > "$PASSAGE_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$PASSAGE_KEYSTORE"

      - name: Download passage-cli
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          out=android/app/build/outputs/apk/release
          cp "$out/app-arm64-v8a-release.apk" "dist/passage-${TAG#v}-arm64.apk"
          cp "$out/app-armeabi-v7a-release.apk" "dist/passage-${TAG#v}-armv7.apk"
          cp "$out/app-universal-release.apk" "dist/passage-${TAG#v}-universal.apk"
          (cd dist && sha256sum *.apk *.tar.gz *.zip > SHA256SUMS)
          # This version's section of CHANGELOG.md.
          awk -v v="## ${TAG#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no CHANGELOG.md section for ${TAG#v}" >&2; exit 1; }
          gh release create "$TAG" dist/* --title "Passage ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  website:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
    # Without this the called job gets no secrets, even from its own environment.
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
