name: CI

# Changes to the website, store listing and docs alone don't need a build.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "site/**"
      - "fastlane/**"
      - "fdroid/**"
      - "scripts/build-site.sh"
      - ".github/workflows/site.yml"
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore: *docs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Go vet and test
        working-directory: ./core
        run: |
          go vet ./tunnel ./update ./internal/... ./cmd/passage-cli ./cmd/passage ./cmd/passage-http-exit ./cmd/passage-update-manifest
          go test -race ./...

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build macOS app
        run: scripts/build-mac.sh ci "$RUNNER_TEMP/mac" "${{ matrix.arch }}"

      - name: Upload macOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ runner.temp }}/mac/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Go vet and test
        working-directory: ./core
        run: |
          go vet ./tunnel ./update ./internal/... ./cmd/passage-cli ./cmd/passage ./cmd/passage-http-exit ./cmd/passage-update-manifest
          go test ./...

      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Build Windows app and passage-cli
        env:
          PYTHON: python
        run: scripts/build-cli.sh ci "$RUNNER_TEMP/win" windows/amd64

      - name: Upload Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-amd64
          path: ${{ runner.temp }}/win/*.zip
          if-no-files-found: error

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the Gradle wrapper
        run: |
          version=$(sed -n 's#.*gradle-\(.*\)-bin.zip#\1#p' android/gradle/wrapper/gradle-wrapper.properties)
          want=$(curl -fsSL "https://services.gradle.org/distributions/gradle-${version}-wrapper.jar.sha256")
          echo "$want  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 11076708
          packages: "ndk;27.2.12479018 platforms;android-36 build-tools;35.0.0"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Go vet and test
        working-directory: ./core
        run: |
          go vet ./tunnel ./update ./internal/... ./cmd/passage-cli ./cmd/passage ./cmd/passage-http-exit ./cmd/passage-update-manifest
          GOOS=windows go vet ./tunnel ./update ./internal/... ./cmd/passage-cli ./cmd/passage ./cmd/passage-http-exit ./cmd/passage-update-manifest
          go test -race ./...


      - name: Set up Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
          sudo apt-get install -y -qq musl-tools

      # One platform with the iroh helper; releases build all four.
      - name: Build passage-cli
        run: scripts/build-cli.sh ci "$RUNNER_TEMP/cli" linux/amd64

      - name: Build libpassage.so
        env:
          PASSAGE_LINK_AUTHOR_KEY: ${{ vars.PASSAGE_LINK_AUTHOR_KEY }}
        run: scripts/build-native.sh

      # Unsigned: only tagged releases get the signing key.
      - name: Build APK
        working-directory: ./android
        run: ./gradlew --no-daemon assembleRelease lintRelease
