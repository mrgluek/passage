<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passage</title>
<style>
:root {
  --bg: #ffffff; --fg: #1b1c1e; --muted: #5f6368; --accent: #185FA5; --on-accent: #ffffff;
  --shade: rgba(0,0,0,.055); --line: rgba(0,0,0,.12); --warn: #a4372a;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1d1e20; --fg: #e8e9eb; --muted: #a0a4a8; --accent: #85B7EB; --on-accent: #0d2440;
    --shade: rgba(255,255,255,.07); --line: rgba(255,255,255,.14); --warn: #f08b7e; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 "Segoe UI", system-ui, sans-serif; user-select: none; }
header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 4px;
  padding: 8px 8px 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
main { padding: 4px 16px 24px; max-width: 720px; }
h2 { margin: 20px 0 4px; font-size: 14px; font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; margin: 2px 0; white-space: pre-line; }
#updateStatus { margin: 8px 0 0; }
#updateDetail { overflow-wrap: anywhere; user-select: text; }
.warn { color: var(--warn); }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
button { font: inherit; color: var(--accent); background: transparent; border: 1px solid var(--accent);
  border-radius: 6px; padding: 5px 14px; cursor: pointer; margin: 6px 0; }
button:hover { background: var(--shade); }
button.primary { background: var(--accent); color: var(--on-accent); }
button.icon { border: none; border-radius: 50%; width: 36px; height: 36px; padding: 6px; margin: 0; }
button.icon svg { width: 24px; height: 24px; fill: var(--accent); display: block; }
.state { font-size: 18px; font-weight: 600; cursor: pointer; }
.segments { display: flex; border: 1px solid var(--accent); border-radius: 18px; padding: 2px; margin: 4px 0; }
.segments div { flex: 1; text-align: center; padding: 6px 4px; border-radius: 16px; color: var(--accent);
  cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.segments div.on { background: var(--accent); color: var(--on-accent); font-weight: 600; cursor: default; }
.segments.withMenu div { flex: 0 0 auto; padding: 6px 14px; }
.segments.withMenu div.menu { flex: 1; min-width: 0; display: flex; justify-content: center; gap: 2px; cursor: pointer; padding: 6px 8px; }
.segments .menu span:first-child { overflow: hidden; text-overflow: ellipsis; }
#homeRoutes, #settingsRoutes { position: relative; }
.routeMenu { position: absolute; left: 0; right: 0; z-index: 5; max-height: 240px; overflow-y: auto; padding: 4px 0;
  background: var(--bg); border: 1px solid var(--accent); border-radius: 10px; box-shadow: 0 2px 8px var(--shade); }
.routeMenu div { padding: 7px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.routeMenu div:hover { background: var(--shade); }
.routeMenu div.on { color: var(--accent); font-weight: 600; }
.values { background: var(--shade); border-radius: 8px; padding: 6px 10px; }
.values .v { display: flex; padding: 5px 0; cursor: pointer; }
.values .v span:first-child { width: 80px; color: var(--muted); font-size: 12px; }
.values .v span:last-child { flex: 1; font: 13px Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
pre { font: 12px/1.4 Consolas, monospace; white-space: pre-wrap; word-break: break-all; margin: 4px 0;
  user-select: text; }
textarea, input[type=text] { width: 100%; font: 13px Consolas, monospace; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; user-select: text; }
textarea { min-height: 72px; resize: vertical; }
label.check { display: flex; gap: 8px; align-items: center; margin: 6px 0; cursor: pointer; }
a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.rrow { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.rrow.off .rname { color: var(--muted); }
.rrow .rname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow button { margin: 0; padding: 1px 10px; }
.rrow input[type=text] { width: 64px; text-align: center; font: inherit; padding: 2px 4px; }
.hidden { display: none !important; }
#toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: 90%;
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s;
  pointer-events: none; z-index: 5; }
#toast.on { opacity: .92; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 4; }
#modal > div { background: var(--bg); border-radius: 10px; padding: 16px 18px; width: min(560px, 92vw); max-height: 86vh;
  display: flex; flex-direction: column; box-shadow: 0 8px 30px rgba(0,0,0,.3); }
#modal h3 { margin: 0 0 8px; font-size: 15px; }
#modalBody { overflow: auto; white-space: pre-wrap; user-select: text; }
#modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

  <button class="icon hidden" id="backBtn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>

  <button class="icon" id="settingsBtn"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>

<script>
"use strict";
// The bridge: the desktop window binds passageCall and answers through
// passageReply; the development server answers over HTTP.
const pending = {};
let seq = 0;
window.passageReply = (id, out) => {
  const p = pending[id];
  delete pending[id];
  if (p) out.error ? p.reject(new Error(out.error)) : p.resolve(out.result);
};
function call(method, arg = null) {
  if (window.passageCall) {
    return new Promise((resolve, reject) => {
      const id = ++seq;
      pending[id] = { resolve, reject };
      window.passageCall(id, method, arg);
    });
  }
  return fetch("/call", { method: "POST", body: JSON.stringify({ token: window.passageToken, method, arg }) })
    .then(r => r.json()).then(out => { if (out.error) throw new Error(out.error); return out.result; });
}

const $ = id => document.getElementById(id);
let S = {}, info = {};
// t formats like Go: %[1]s, %[2]d.
function t(key, ...args) {
  return (S[key] ?? key).replace(/%\[(\d+)\][sd]/g, (_, n) => String(args[n - 1]));
}
let toastTimer;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 2500);
}
const fail = e => toast(e.message || String(e));

function modal(title, body, ok, cancel) {
  return new Promise(resolve => {
    $("modalTitle").textContent = title;
    $("modalBody").textContent = body;
    $("modalOk").textContent = ok;
    $("modalCancel").textContent = cancel || "";
    $("modalCancel").classList.toggle("hidden", !cancel);
    $("modal").classList.remove("hidden");
    const done = v => { $("modal").classList.add("hidden"); $("modalOk").onclick = $("modalCancel").onclick = null; resolve(v); };
    $("modalOk").onclick = () => done(true);
    $("modalCancel").onclick = () => done(false);
  });
}
function copy(text, message) {
  call("copy", text).then(() => toast(message)).catch(() =>
    navigator.clipboard.writeText(text).then(() => toast(message), fail));
}
function tip(id, key) { $(id).title = t(key); $(id).setAttribute("aria-label", t(key)); }

function closeRouteMenus() {
  document.querySelectorAll(".routeMenu").forEach(m => m.remove());
}
document.addEventListener("click", closeRouteMenus);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRouteMenus(); });

function chooseRoute(mode) { call("setMode", mode).then(refresh, fail); }

// The list of installed routes, under the Routes segment.
function routeMenu(box, v) {
  const menu = document.createElement("div");
  menu.className = "routeMenu";
  menu.setAttribute("role", "menu");
  for (const r of v.routes) {
    const item = document.createElement("div");
    item.className = r.mode === v.mode ? "on" : "";
    item.textContent = r.label;
    item.title = r.label;
    item.setAttribute("role", "menuitemradio");
    item.setAttribute("aria-checked", r.mode === v.mode);
    item.onclick = () => chooseRoute(r.mode);
    menu.appendChild(item);
  }
  box.appendChild(menu);
}

// The route choice: Auto, My if set, the installed routes in a list, Direct.
function segments(box, v) {
  box.innerHTML = "";
  const fixed = v.routes.find(r => r.mode === v.mode);
  const choices = [["auto", t("mode_auto")]];
  if (v.my) choices.push(["my", t("route_my")]);
  if (v.routes.length) choices.push(["routes", fixed ? fixed.id : t("route_menu")]);
  choices.push(["off", t("mode_off")]);
  const row = document.createElement("div");
  row.className = v.routes.length ? "segments withMenu" : "segments";
  for (const [mode, label] of choices) {
    const d = document.createElement("div");
    if (mode === "routes") {
      const name = document.createElement("span");
      name.textContent = label;
      const arrow = document.createElement("span");
      arrow.textContent = "\u25BE";
      d.append(name, arrow);
      d.className = fixed ? "menu on" : "menu";
      d.title = fixed ? fixed.label : label;
      d.setAttribute("role", "button");
      d.setAttribute("aria-haspopup", "menu");
      d.onclick = e => {
        e.stopPropagation();
        const open = box.querySelector(".routeMenu");
        closeRouteMenus();
        if (!open) routeMenu(box, v);
      };
    } else {
      d.textContent = label;
      if (mode === v.mode) d.className = "on";
      else d.onclick = () => chooseRoute(mode);
    }
    row.appendChild(d);
  }
  box.appendChild(row);
}

let last = null, shownRoutes = "", shownValues = "", shownSubscriptions = "";
function render(v) {
  v.routes = v.routes || [];
  last = v;
  $("subscriptionNotice").textContent = v.subscription_notice || "";
  $("subscriptionNotice").classList.toggle("hidden", !v.subscription_notice);
  const subKey = JSON.stringify(v.subscriptions);
  if (subKey !== shownSubscriptions) {
    shownSubscriptions = subKey;
    renderSubscriptions(v.subscriptions || []);
    if (!$("settings").classList.contains("hidden")) showLink(false);
  }
  const u = v.update;
  $("updateNotice").classList.toggle("hidden", !u.enabled || !["available", "downloading", "ready", "installing"].includes(u.state));
  $("updateNotice").textContent = t("update_" + u.state, u.version);
  $("updateSettings").classList.toggle("hidden", !u.enabled);
  $("updateStatus").textContent = u.error || t("update_" + u.state, u.version);
  const failures = u.detail.split("\n").filter(Boolean);
  $("updateDetail").textContent = failures.length > 1 ? failures.map(s => "• " + s).join("\n") : u.detail;
  $("updateDetail").classList.toggle("hidden", !u.detail);
  $("updateProgress").classList.toggle("hidden", u.state !== "downloading");
  $("updateProgress").max = u.total || 1;
  $("updateProgress").value = u.done;
  $("updateCheck").disabled = ["checking", "downloading", "installing"].includes(u.state);
  $("updateDownload").classList.toggle("hidden", !u.version || ["checking", "downloading", "ready", "installing"].includes(u.state));
  $("updateInstall").classList.toggle("hidden", !u.ready);
  $("updateCancel").classList.toggle("hidden", !["checking", "downloading"].includes(u.state));
  $("head").textContent = v.head;
  $("line").textContent = v.line;
  $("startStopPath").setAttribute("d", v.running
    ? "M7,6h10a1,1 0,0 1,1 1v10a1,1 0,0 1,-1 1h-10a1,1 0,0 1,-1 -1v-10a1,1 0,0 1,1 -1z"
    : "M8,5.5v13a1,1 0,0 0,1.5 0.86l10.2,-6.5a1,1 0,0 0,0 -1.72l-10.2,-6.5A1,1 0,0 0,8 5.5z");
  tip("startStop", v.running ? "action_stop" : "action_start");
  $("noLink").classList.toggle("hidden", v.has_link);
  const routesKey = JSON.stringify([v.routes, v.my, v.mode]);
  if (routesKey !== shownRoutes) {
    shownRoutes = routesKey;
    segments($("homeRoutes"), v);
    segments($("settingsRoutes"), v);
  }
  const rows = [[t("proxy_host"), v.host], [t("proxy_port"), String(v.port)]];
  if (v.auth) rows.push([t("proxy_user"), v.user], [t("proxy_pass"), v.pass]);
  const valuesKey = JSON.stringify(rows);
  if (valuesKey !== shownValues) {
    shownValues = valuesKey;
    const box = $("values");
    box.innerHTML = "";
    for (const [label, value] of rows) {
      const r = document.createElement("div");
      r.className = "v";
      r.innerHTML = "<span></span><span></span>";
      r.children[0].textContent = label;
      r.children[1].textContent = value;
      r.onclick = () => copy(value, t("value_copied", label));
      box.appendChild(r);
    }
    if (!v.auth) {
      const n = document.createElement("p");
      n.className = "hint";
      n.textContent = t("proxy_no_password");
      box.appendChild(n);
    }
  }
  $("status").textContent = v.full;
}
function renderSubscriptions(rows) {
  const box = $("subscriptions");
  box.textContent = "";
  for (const sub of rows) {
    const row = document.createElement("div");
    const title = document.createElement("p"); title.textContent = sub.name;
    const detail = document.createElement("p"); detail.className = "hint"; detail.textContent = sub.detail;
    const result = document.createElement("p"); result.className = "hint"; result.setAttribute("aria-live", "polite"); result.textContent = sub.busy ? t("sub_refreshing") : sub.result;
    const refreshButton = document.createElement("button"); refreshButton.textContent = t("sub_refresh"); refreshButton.disabled = sub.busy;
    refreshButton.hidden = sub.closed;
    refreshButton.onclick = () => call("refreshSubscriptions", sub.id).then(refresh, fail);
    const remove = document.createElement("button"); remove.textContent = t("sub_remove");
    remove.onclick = async () => {
      if (await modal(t("sub_remove"), t("sub_remove_confirm", sub.name), t("sub_remove"), t("cancel"))) {
        call("removeSubscription", sub.id).then(() => { showLink(false); refresh(); }, fail);
      }
    };
    row.append(title, detail, result, refreshButton, remove); box.append(row);
  }
}
function refresh() { return call("view").then(render, fail); }

let savedList = [], draft = null, editing = false;
// routeText is "priority id (type)", as in the route menu.
const routeText = r => r.priority + " " + r.id + (r.id === r.type ? "" : " (" + r.type + ")") + (r.subscription ? " · " + r.subscription : "");
function renderRoutes() {
  const box = $("savedRoutes");
  const list = editing ? draft : savedList;
  box.textContent = "";
  list.forEach((r, i) => {
    const row = document.createElement("div");
    row.className = "rrow" + (r.on ? "" : " off");
    const name = document.createElement("span");
    name.className = "rname";
    name.textContent = (r.on ? "[x] " : "[  ] ") + routeText(r);
    if (!editing) { row.append(name); box.append(row); return; }
    const on = document.createElement("input");
    on.type = "checkbox"; on.checked = r.on;
    on.onchange = () => { r.on = on.checked; renderRoutes(); };
    name.textContent = routeText({...r, priority: ""}).trim();
    const step = d => () => { r.priority = Math.max(0, Math.min(65535, r.priority + d)); renderRoutes(); };
    const minus = document.createElement("button"); minus.textContent = "−"; minus.onclick = step(-5);
    const plus = document.createElement("button"); plus.textContent = "+"; plus.onclick = step(5);
    const num = document.createElement("input");
    num.type = "text"; num.value = r.priority; num.inputMode = "numeric";
    num.onchange = () => { const n = parseInt(num.value, 10); if (n >= 0 && n <= 65535) r.priority = n; renderRoutes(); };
    row.append(on, name, minus, num, plus);
    box.append(row);
  });
  $("editRoutes").classList.toggle("hidden", editing || !savedList.length);
  $("editBar").classList.toggle("hidden", !editing);
  $("routesHint").classList.toggle("hidden", !editing);
}
$("editRoutes").onclick = () => { draft = savedList.map(r => ({...r})); editing = true; renderRoutes(); };
$("cancelRoutes").onclick = () => { editing = false; draft = null; renderRoutes(); };
$("saveRoutes").onclick = () => call("saveRoutes", draft).then(() => {
  editing = false; draft = null;
  toast(t("saved"));
  showLink(false);
  refresh();
}, fail);
function showLink(open) {
  return call("link", open).then(l => {
    $("linkInfo").textContent = (l.routes || []).length ? "" : l.info || "";
    savedList = l.routes || [];
    if (!editing) renderRoutes();
    $("linkError").textContent = l.error || "";
    // A saved link stays folded so its key is not on screen.
    const unfold = open || !l.has || !!l.error;
    $("linkBox").classList.toggle("hidden", !unfold);
    $("changeLink").classList.toggle("hidden", unfold);
  }, fail);
}
function showSettings() {
  call("settings").then(s => {
    $("autoUpdate").checked = s.auto_update;
    $("auth").checked = s.auth;
    $("autostart").checked = s.autostart;
    $("my").value = s.my;
    $("myClear").classList.toggle("hidden", !s.my);
    $("about").textContent = t("about_version", info.version, s.soar);
  }, fail);
  showLink(false);
}
function refreshAutostart() {
  return call("settings").then(s => { $("autostart").checked = s.autostart; }, fail);
}
function page(name) {
  $("home").classList.toggle("hidden", name !== "home");
  $("settings").classList.toggle("hidden", name !== "settings");
  $("backBtn").classList.toggle("hidden", name !== "settings");
  $("settingsBtn").classList.toggle("hidden", name === "settings");
  $("title").textContent = name === "settings" ? t("settings") : "Passage " + info.version;
  if (name === "settings") showSettings();
  scrollTo(0, 0);
}

$("updateNotice").onclick = () => page("settings");
$("autoUpdate").onchange = () => call("setAutoUpdate", $("autoUpdate").checked).catch(fail);
for (const method of ["updateCheck", "updateDownload", "updateCancel"]) $(method).onclick = () => call(method).then(refresh, fail);
$("updateInstall").onclick = async () => {
  if (await modal(t("update_install"), t("update_restart"), t("update_install"), t("cancel"))) call("updateInstall").then(refresh, fail);
};
$("subscriptionNotice").onclick = () => call("dismissSubscriptionNotice").then(refresh, fail);
$("subscriptionNotice").onkeydown = e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("subscriptionNotice").click(); }
};
$("startStop").onclick = () => call(last && last.running ? "stop" : "start").then(refresh, fail);
$("settingsBtn").onclick = $("openSettings").onclick = () => page("settings");
$("backBtn").onclick = () => page("home");
$("head").onclick = () => {
  if (!last || !last.running) return toast(t("proxy_stopped"));
  call("recheck").then(refresh);
  setTimeout(refresh, 3100);
};
$("copyLink").onclick = () => last && copy(last.proxy_link, t("proxy_link_copied"));
$("copyTg").onclick = () => last && call("openTg").then(opened => copy(last.tg_link, t(opened ? "tg_link_opened" : "tg_link_copied")), fail);
let reporting = false;
$("report").onclick = () => {
  if (reporting) return;
  reporting = true;
  if (last && last.running) modal(t("send_report"), t("testing_network"), t("close"));
  call("report").then(() => {
    $("modal").classList.add("hidden");
    toast(t("report_copied"));
  }, e => { $("modal").classList.add("hidden"); fail(e); }).finally(() => { reporting = false; refresh(); });
};

$("changeLink").onclick = () => showLink(true).then(() => $("linkText").focus());
async function importLink(text) {
  if (!text.trim()) return;
  try {
    const preview = await call("importPreview", text);
    const subscribe = preview.mode === "subscribe";
    if (!await modal(t(subscribe ? "subscribe" : "import_title"), preview.text, t(subscribe ? "subscribe" : "save"), t("cancel"))) return;
    if (subscribe) await call("importLink", {link: text, subscribe: true, replace: preview.collision});
    else await call("saveLink", text);
    toast(t("saved"));
    $("linkText").value = "";
    showLink(false);
    refresh();
  } catch (e) { toast(t("link_error", e.message)); }
}
$("saveLink").onclick = () => importLink($("linkText").value);
$("my").oninput = () => $("myClear").classList.toggle("hidden", !$("my").value);
$("myClear").onclick = () => { $("my").value = ""; $("my").oninput(); $("my").focus(); };
$("saveMy").onclick = () => call("saveMy", $("my").value).then(v => {
  $("my").value = v;
  $("my").oninput();
  toast(t(v ? "my_route_saved" : "my_route_removed"));
  refresh();
}, fail);
$("auth").onchange = () => call("setAuth", $("auth").checked).then(refresh, fail);
$("newAccess").onclick = () => call("newAccess").then(() => { toast(t("new_access_done")); refresh(); }, fail);
$("autostart").onchange = () => call("setAutostart", $("autostart").checked).then(refreshAutostart, e => {
  refreshAutostart();
  fail(e);
});
window.addEventListener("focus", () => {
  if (!$("settings").classList.contains("hidden")) refreshAutostart();
});
$("openFolder").onclick = () => call("openFolder").catch(fail);
$("site").onclick = () => call("open", info.site).catch(fail);
$("source").onclick = () => call("open", info.source).catch(fail);
$("licenses").onclick = () => call("licenses").then(text => modal(t("about_licenses"), text, t("close")), fail);
document.addEventListener("keydown", e => {
  if (e.key !== "Escape" || $("modal").classList.contains("hidden")) return;
  ($("modalCancel").classList.contains("hidden") ? $("modalOk") : $("modalCancel")).click();
});

const initialized = call("init").then(i => {
  info = i;
  S = i.strings;
  document.documentElement.lang = i.lang;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  $("linkText").placeholder = t("link_hint");
  $("my").placeholder = t("my_route_hint");
  $("folder").textContent = i.dir;
  $("site").textContent = i.site;
  $("source").textContent = i.source;
  tip("settingsBtn", "settings");
  tip("backBtn", "back");
  tip("copyLink", "copy_proxy_link");
  tip("copyTg", "copy_tg_link");
  tip("report", "send_report");
  tip("myClear", "clear");
  page("home");
  refresh();
  // Only while the window is visible, as the app polls only on screen.
  setInterval(() => { if (!document.hidden) refresh(); }, 2000);
});
initialized.catch(fail);

let incomingImports = Promise.resolve();
window.passageImport = text => {
  incomingImports = incomingImports.then(async () => {
    await initialized;
    while (!$("modal").classList.contains("hidden")) {
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    await importLink(text);
  }).catch(fail);
};
</script>
</body>
</html>
