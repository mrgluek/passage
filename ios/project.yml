name: Passage
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '16.0'
  knownRegions: [en, ru]
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
    'CODE_SIGN_IDENTITY[sdk=iphonesimulator*]': '-'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  Passage:
    type: application
    platform: iOS
    sources: [Passage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.gluek.passage
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - framework: build/Passage.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: libresolv.tbd
  PassageTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PassageTests]
    dependencies:
      - target: Passage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.gluek.passage.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Passage:
    build:
      targets:
        Passage: all
    test:
      targets: [PassageTests]
